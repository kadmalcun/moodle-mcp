[project]
name = "moodle-mcp"
version = "0.1.0"
description = "東京工科大学の Moodle を AI から読むためのローカル MCP サーバー"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "playwright>=1.64,<2",
    "markdownify>=1.2,<2",
    "pypdf>=6.0,<7",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
moodle = "moodle_mcp.cli:main"
moodle-mcp = "moodle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_mcp"]
